<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check in at a dog area</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6B4F;text-decoration:none}a:hover{color:#24543E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Nunito', sans-serif; color: #2B2622; padding: 16px 20px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="Place.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #F6EFE3; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2622" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; line-height: 1.15;">
      <span style="font-size: 13px; color: #6B6158;">Šeimyniškių g. 30</span>
      <span style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 22px;">How is it today?</span>
    </div>
  </div>

  <div role="group" aria-label="Rating" style="display: flex; justify-content: center; gap: 10px;">
    <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
      <button onClick="{{s.pick}}" aria-label="{{s.label}}" style="width: 52px; height: 52px; border: none; background: transparent; cursor: pointer; padding: 0;">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="{{s.fill}}" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"></path></svg>
      </button>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <button aria-label="Add a photo" style="height: 96px; border-radius: 18px; border: 2px dashed #C9BBA6; background: #FBF7F0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #6B6158; cursor: pointer;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6B6158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Photo
    </button>
    <div style="height: 96px; border-radius: 18px; background: linear-gradient(180deg, #CFE7F2 0%, #CFE7F2 50%, #B7D6A8 50%, #9CC78F 100%);"></div>
    <div style="height: 96px; border-radius: 18px; background: linear-gradient(180deg, #E8F3F7 0%, #E8F3F7 45%, #CFE3C3 45%, #A9CB98 100%);"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 16px;">Fence</div>
    <div style="display: flex; gap: 10px;">
      <sc-for list="{{fence}}" as="f" hint-placeholder-count="2">
        <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="flex: 1; height: 52px; border-radius: 16px; border: 2px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer;">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 16px;">What's here?</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
        <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer;">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1;"></div>
  <a href="Place.dc.html" style="height: 58px; border-radius: 18px; background: #2F6B4F; color: #FFFFFF; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center;">Check in</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { stars: 4, fence: 'ok', tags: { fenced: true, big: true } };
}
renderVals() {
const { stars, fence, tags } = this.state;
const starList = [1, 2, 3, 4, 5].map((n) => ({
label: n + (n === 1 ? ' star' : ' stars'), fill: n <= stars ? '#F2A93B' : '#E7DCCB',
pick: () => this.setState({ stars: n })
}));
const fenceList = [['ok', 'Fence OK', '#1E6B3A', '#DDF1E3'], ['broken', 'Broken', '#A63A24', '#FDE2DC']].map(([id, label, ink, tint]) => {
const on = fence === id;
return { label, on: on ? 'true' : 'false', bg: on ? tint : '#FFFFFF', fg: on ? ink : '#2B2622', border: on ? ink : '#E2D6C3', pick: () => this.setState({ fence: id }) };
});
const tagList = [['fenced', 'Fenced'], ['big', 'Big dogs'], ['small', 'Small dogs'], ['agility', 'Agility'], ['water', 'Water'], ['shade', 'Shade']].map(([id, label]) => {
const on = !!tags[id];
return {
label: on ? '✓ ' + label : label, on: on ? 'true' : 'false',
bg: on ? '#2B2622' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2B2622', border: on ? '#2B2622' : '#E2D6C3',
pick: () => this.setState({ tags: { ...this.state.tags, [id]: !this.state.tags[id] } })
};
});
return { stars: starList, fence: fenceList, tags: tagList };
}
}
</script>
</body>
</html>
