<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BytePets home map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6B4F;text-decoration:none}a:hover{color:#24543E}
input::placeholder{color:#6B6158}
@media (prefers-reduced-motion: reduce){.bp-anim{transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5EFE4; font-family: 'Nunito', sans-serif; color: #2B2622;">
  <div onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" style="position: absolute; left: {{mapLeft}}px; top: {{mapTop}}px; width: 1200px; height: 1112px; transform: scale(0.8); transform-origin: 0 0; touch-action: none; cursor: {{cursor}};">
    <dc-import name="VilniusMap" mode="all" show="{{show}}" vx="{{vx}}" vy="{{vy}}" vw="{{vw}}" vh="{{vh}}" hint-size="1200px,1112px"></dc-import>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 12px; height: 56px; background: #FFFFFF; border: 1px solid #E2D6C3; border-radius: 20px; box-shadow: 0 6px 18px rgba(43,38,34,0.16); display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; box-sizing: border-box;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#3B7DD8" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"></path></svg>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15;">
      <span style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px;">Šnipiškės</span>
      <span style="font-size: 12px; color: #6B6158;">Vilnius · sample pins</span>
    </div>
    <button aria-label="Menu" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: #F6EFE3; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2622" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 78px; padding: 0 12px; display: flex; gap: 8px; overflow-x: auto;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="flex-shrink: 0; height: 40px; padding: 0 14px 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; box-shadow: 0 3px 10px rgba(43,38,34,0.12); font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 7px; cursor: pointer;">
        <span style="width: 12px; height: 12px; border-radius: 999px; background: {{c.dot}}; border: 2px solid #FFFFFF;"></span>{{c.label}}<sc-if value="{{c.hasCount}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #E0583F; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center;">{{c.count}}</span></sc-if>
      </button>
    </sc-for>
  </div>

  <button aria-label="Show my location" style="position: absolute; right: 16px; bottom: 156px; width: 48px; height: 48px; border-radius: 999px; border: 1px solid #E2D6C3; background: #FFFFFF; box-shadow: 0 6px 16px rgba(43,38,34,0.18); display: flex; align-items: center; justify-content: center; cursor: pointer;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B7DD8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
  </button>
  <a href="VetAnswer.dc.html" style="position: absolute; right: 16px; bottom: 94px; height: 48px; padding: 0 18px 0 14px; border-radius: 999px; background: #C8432B; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; box-shadow: 0 6px 16px rgba(200,67,43,0.35);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z"></path></svg>
    Vet open now
  </a>

  <div class="bp-anim" style="position: absolute; bottom: 24px; left: {{cLeft}}px; width: {{cWidth}}px; height: 58px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2D6C3; box-shadow: 0 10px 28px rgba(43,38,34,0.25); overflow: hidden; box-sizing: border-box; transition: left 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);">
    <sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{expand}}" aria-label="Open the assistant" style="width: 56px; height: 56px; border: none; border-radius: 999px; background: #2F6B4F; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><circle cx="6.5" cy="9" r="2"></circle><circle cx="12" cy="6.5" r="2"></circle><circle cx="17.5" cy="9" r="2"></circle><path d="M7.5 17c0-3 2.2-5 4.5-5s4.5 2 4.5 5c0 2-2.2 2.2-4.5 2.2S7.5 19 7.5 17z"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
      <div style="width: 358px; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; box-sizing: border-box;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#2F6B4F" aria-hidden="true"><circle cx="6.5" cy="9" r="2"></circle><circle cx="12" cy="6.5" r="2"></circle><circle cx="17.5" cy="9" r="2"></circle><path d="M7.5 17c0-3 2.2-5 4.5-5s4.5 2 4.5 5c0 2-2.2 2.2-4.5 2.2S7.5 19 7.5 17z"></path></svg>
        <label for="ask" style="position: absolute; left: -9999px;">Ask BytePets</label>
        <input id="ask" placeholder="Ask BytePets…" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: 'Nunito', sans-serif; font-size: 16px; color: #2B2622; outline: none;">
        <a href="VetAnswer.dc.html" aria-label="Send" style="width: 42px; height: 42px; border-radius: 999px; background: #2F6B4F; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { ox: 400, oy: 40, collapsed: false, dragging: false, show: 'all' };
this.drag = null;
}
renderVals() {
const S = 0.8;
const { ox, oy, collapsed, dragging, show } = this.state;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const defs = [['all', 'All', '#2B2622', ''], ['areas', 'Dog areas', '#3E8E5E', ''], ['vets', 'Vets', '#0F7C78', ''], ['cafes', 'Cafés', '#D9822B', ''], ['lost', 'Lost & found', '#E0583F', '3']];
const chips = defs.map(([id, label, dot, count]) => {
const on = show === id;
return {
label, dot, count, hasCount: count !== '', on: on ? 'true' : 'false',
bg: on ? '#2B2622' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2B2622', border: on ? '#2B2622' : '#E2D6C3',
pick: () => this.setState({ show: id })
};
});
return {
chips, show,
mapLeft: (-ox * S).toFixed(1),
mapTop: (-oy * S).toFixed(1),
vx: ox, vy: oy, vw: 390 / S, vh: 844 / S,
cursor: dragging ? 'grabbing' : 'grab',
collapsed, expanded: !collapsed,
cLeft: collapsed ? 318 : 16,
cWidth: collapsed ? 56 : 358,
onDown: (e) => {
if (e.target && e.target.closest && e.target.closest('a,button')) return;
this.drag = { x: e.clientX, y: e.clientY, ox, oy, moved: false };
if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
this.setState({ dragging: true });
},
onMove: (e) => {
const d = this.drag;
if (!d) return;
const dx = e.clientX - d.x, dy = e.clientY - d.y;
if (!d.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
d.moved = true;
this.setState({
collapsed: true,
ox: clamp(d.ox - dx / S, 0, 1200 - 390 / S),
oy: clamp(d.oy - dy / S, 0, 1112 - 844 / S)
});
},
onUp: () => { this.drag = null; this.setState({ dragging: false }); },
expand: () => this.setState({ collapsed: false })
};
}
}
</script>
</body>
</html>
