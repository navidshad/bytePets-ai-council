<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["all","vets","lost"],"default":"all"},"show":{"editor":"enum","options":["all","areas","vets","cafes","lost"],"default":"all"},"vx":{"editor":null},"vy":{"editor":null},"vw":{"editor":null},"vh":{"editor":null},"$preview":{"width":1200,"height":1112}}'>
class Component extends DCLogic {
renderVals() {
const mode = this.props.mode ?? 'all';
const show = this.props.show ?? 'all';
const K = { area: '#3E8E5E', vet: '#0F7C78', cafe: '#D9822B', lost: '#E0583F', found: '#3B7DD8', closed: '#A39A90' };
const group = { area: 'areas', vet: 'vets', cafe: 'cafes', lost: 'lost', found: 'lost' };
const raw = [
['A1', 'area', 'none', 431, 161, 'Dog area, Šeškinės g. 45A: no ratings yet'],
['A2', 'area', 'broken', 497, 237, 'Dog area, Gelvonų g. 1: fence broken (sample)'],
['A3', 'area', 'repair', 710, 242, 'Dog area, Ozo and Tauragnų g.: needs repair (sample)'],
['A4', 'area', 'good', 634, 268, 'Dog area, Neries senvagės park: good (sample)'],
['A5', 'area', 'good', 788, 512, 'Dog area, Šeimyniškių g. 30: good, busy now (sample)'],
['A6', 'area', 'good', 458, 666, 'Dog area, Vytauto g. 1: good (sample)'],
['A7', 'area', 'none', 404, 728, 'Dog area, Čiurlionio g.: no ratings yet'],
['A8', 'area', 'good', 701, 849, 'Dog area, Šopeno g. 1: good (sample)'],
['A9', 'area', 'good', 446, 869, 'Dog area, Skroblų g.: good (sample)'],
['V1', 'vet', 'open', 656, 600, 'Paw Clinic (sample): open now'],
['V2', 'vet', 'night', 550, 452, 'Night Vet (sample): open 24 hours'],
['V3', 'vet', 'open', 812, 352, 'Happy Tails Vet (sample): open now'],
['V4', 'vet', 'closed', 475, 565, 'Green Vet (sample): closed'],
['V5', 'vet', 'closed', 750, 740, 'Old Town Vet (sample): closed'],
['C1', 'cafe', 'ok', 720, 640, 'Café, dogs welcome (sample)'],
['C2', 'cafe', 'ok', 668, 700, 'Café with a water bowl (sample)'],
['C3', 'cafe', 'ok', 587, 352, 'Café, terrace only (sample)'],
['C4', 'cafe', 'ok', 518, 790, 'Café with a dog menu (sample)'],
['L1', 'lost', 'lost', 618, 415, 'Lost dog (sample)'],
['L2', 'lost', 'lost', 812, 802, 'Lost cat (sample)'],
['F1', 'found', 'found', 537, 627, 'Found dog (sample)']
];
const results = mode === 'vets' ? { V1: '1', V2: '2', V3: '3' } : mode === 'lost' ? { F1: '1' } : {};
const vx = this.props.vx;
const pins = raw.filter(([id, kind]) => mode !== 'all' || show === 'all' || group[kind] === show).map(([id, kind, status, x, y, label]) => {
const num = results[id];
let opacity = mode !== 'all' && !num ? 0.25 : 1;
if (vx !== undefined && vx !== null) {
const vy = this.props.vy ?? 0, vw = this.props.vw ?? 487.5, vh = this.props.vh ?? 1055;
const edge = Math.min(x - vx, vx + vw - x, y - vy - 90, vy + vh - y - 110);
opacity = opacity * Math.max(0.15, Math.min(1, edge / 70));
}
let badge = '', badgeBg = '#2F6B4F';
if (num) badge = num;
else if (status === 'broken') { badge = '!'; badgeBg = '#C8432B'; }
else if (status === 'repair') { badge = '!'; badgeBg = '#D9822B'; }
else if (status === 'night') { badge = '24'; badgeBg = '#2B2622'; }
const fill = status === 'closed' || status === 'none' ? K.closed : K[kind];
return {
label, left: x - 30, top: y - 30, fill,
href: kind === 'area' ? 'Place.dc.html' : kind === 'vet' ? 'VetAnswer.dc.html' : (kind === 'lost' || kind === 'found') ? 'LostDog.dc.html' : 'Lists.dc.html',
isPaw: kind === 'area', isCross: kind === 'vet', isCup: kind === 'cafe', isDog: kind === 'lost' || kind === 'found',
opacity: opacity.toFixed(2), badge, badgeBg, showBadge: badge !== ''
};
});
return { pins, showExtras: mode === 'all', showMe: mode === 'all' };
}
}
