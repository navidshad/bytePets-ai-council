<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a lost or found pet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6B4F;text-decoration:none}a:hover{color:#24543E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Nunito', sans-serif; color: #2B2622; padding: 16px 20px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="LostDog.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; background: #F6EFE3; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2622" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <span style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 22px;">Report a pet</span>
  </div>

  <div role="group" aria-label="Lost or found" style="display: flex; padding: 4px; border-radius: 16px; background: #F6EFE3;">
    <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
      <button onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="flex: 1; height: 48px; border: none; border-radius: 12px; background: {{k.bg}}; color: {{k.fg}}; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer;">{{k.label}}</button>
    </sc-for>
  </div>

  <button aria-label="Add photos" style="height: 150px; border-radius: 20px; border: 2px dashed #C9BBA6; background: #FBF7F0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #6B6158; cursor: pointer;">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#6B6158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    Add photos
    <span style="font-size: 12px; font-weight: 600;">AI fills in the details</span>
  </button>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 16px;">Pet</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <sc-for list="{{pets}}" as="p" hint-placeholder-count="6">
        <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer;">{{p.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 16px;">Where and when</div>
    <div style="position: relative; height: 120px; border-radius: 18px; overflow: hidden; background: #F5EFE4; border: 1px solid #E2D6C3;">
      <svg width="350" height="120" viewBox="0 0 350 120" aria-hidden="true" style="position: absolute; left: 0; top: 0;"><path d="M-10 80 C60 60 120 100 190 70 S300 40 360 60" stroke="#BCDDEA" stroke-width="16" fill="none"></path><ellipse cx="80" cy="30" rx="60" ry="26" fill="#DCEBD2"></ellipse></svg>
      <div style="position: absolute; left: 140px; top: 22px; width: 76px; height: 76px; border-radius: 999px; background: rgba(224,88,63,0.16); border: 2px dashed #E0583F; display: flex; align-items: center; justify-content: center;">
        <span style="width: 18px; height: 18px; border-radius: 999px; background: #E0583F; border: 3px solid #FFFFFF;"></span>
      </div>
      <div style="position: absolute; left: 10px; bottom: 8px; padding: 3px 10px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 700; color: #6B6158;">Near Vingis Park · today, 18:30</div>
    </div>
    <div style="font-size: 12px; color: #6B6158;">Shown as a rough area, never your exact address.</div>
  </div>

  <div style="flex: 1;"></div>
  <a href="LostDog.dc.html" style="height: 58px; border-radius: 18px; background: {{postBg}}; color: #FFFFFF; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center;">{{postLabel}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { kind: 'lost', pet: { dog: true, medium: true, brown: true } };
}
renderVals() {
const { kind, pet } = this.state;
const kinds = [['lost', 'I lost a pet', '#E0583F'], ['found', 'I found a pet', '#3B7DD8']].map(([id, label, color]) => {
const on = kind === id;
return { label, on: on ? 'true' : 'false', bg: on ? color : 'transparent', fg: on ? '#FFFFFF' : '#2B2622', pick: () => this.setState({ kind: id }) };
});
const pets = [['dog', 'Dog'], ['cat', 'Cat'], ['other', 'Other'], ['medium', 'Medium'], ['brown', 'Brown'], ['collar', 'Red collar']].map(([id, label]) => {
const on = !!pet[id];
return {
label: on ? '✓ ' + label : label, on: on ? 'true' : 'false',
bg: on ? '#2B2622' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2B2622', border: on ? '#2B2622' : '#E2D6C3',
pick: () => this.setState({ pet: { ...this.state.pet, [id]: !this.state.pet[id] } })
};
});
return {
kinds, pets,
postLabel: kind === 'lost' ? 'Post and look for matches' : 'Post and tell the owners',
postBg: kind === 'lost' ? '#E0583F' : '#3B7DD8'
};
}
}
</script>
</body>
</html>
